<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            overflow: hidden; /* Prevents whole-page scrolling */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 520px;
            width: 100%;
            height: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column; /* Vertically stacked layout */
        }

        h2 {
            margin: 0 0 14px 0;
            flex-shrink: 0;
        }

        /* Config / Setup Toolbar */
        .config-box {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 14px;
            text-align: left;
            font-size: 0.88rem;
            flex-shrink: 0;
        }

        .course-badge {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #333;
        }

        .course-badge strong {
            color: #007bff;
        }

        .file-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #bd2130;
        }

        .status-msg {
            margin-top: 6px;
            font-size: 0.78rem;
            color: #555;
        }

        /* Roster List - Dynamically Expands and Contracts */
        ul {
            list-style: none;
            padding: 0;
            margin: 0 0 14px 0;
            flex: 1 1 auto; /* Fills all available vertical space */
            min-height: 100px;
            overflow-y: auto; /* Internal scrollbar when roster overflows viewport */
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: #fff;
        }

        li {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #eee;
            background-color: #fafafa;
            transition: background-color 0.2s ease;
        }

        li:last-child {
            border-bottom: none;
        }

        li:hover {
            background-color: #f0f0f0;
        }

        .user-index {
            width: 28px;
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            color: #777;
            margin-right: 10px;
            user-select: none;
        }

        li input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        li label {
            cursor: pointer;
            flex: 1;
            text-align: left;
        }

        .button-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.03);
        }

        button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        #selected-user-container {
            padding: 12px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
        }

        #selected-user {
            display: inline-block;
            font-size: 2.2em;
        }

        .looping-text {
            animation: scrollText 0.3s steps(1) infinite;
            white-space: nowrap;
        }

        @keyframes scrollText {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .removed-item {
            animation: fadeOut 0.4s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(20px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Volunteer List</h2>

        <div class="config-box">
            <div class="course-badge">
                Course: <strong id="display-course-key"></strong>
            </div>
            <div class="file-controls">
                <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
                <button type="button" class="btn-small" onclick="document.getElementById('csv-file-input').click()">Import CSV</button>
                <button type="button" class="btn-small btn-secondary" id="restore-session-btn">Restore Session</button>
                <button type="button" class="btn-small btn-danger" id="clear-cache-btn">Reset Roster</button>
            </div>
            <div id="storage-status" class="status-msg">Ready</div>
        </div>

        <ul id="user-list"></ul>

        <div class="button-container">
            <button id="select-button">Select Random User</button>
            <button id="remove-button" disabled>Remove User</button>
        </div>

        <div id="selected-user-container">
            <span id="selected-user"></span>
        </div>
    </div>

    <script>
        // ==========================================
        // SET YOUR HARDCODED COURSE KEY HERE
        // ==========================================
        const COURSE_KEY = "CHEM1210_D22";
        // ==========================================

        const displayCourseKey = document.getElementById('display-course-key');
        const csvFileInput = document.getElementById('csv-file-input');
        const restoreSessionBtn = document.getElementById('restore-session-btn');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const storageStatus = document.getElementById('storage-status');
        const userListElement = document.getElementById('user-list');
        const selectButton = document.getElementById('select-button');
        const removeButton = document.getElementById('remove-button');
        const selectedUserElement = document.getElementById('selected-user');

        let users = [];
        let selectedUserName = null;
        let userSelectableStatus = {};
        let loopIntervalId = null;
        const loopDuration = 1500;

        displayCourseKey.textContent = COURSE_KEY;

        function getStorageKey() {
            return `roster_${COURSE_KEY}`;
        }

        function saveToStorage() {
            const key = getStorageKey();
            localStorage.setItem(key, JSON.stringify(users));
            storageStatus.textContent = `Saved ${users.length} names to browser storage for "${COURSE_KEY}"`;
        }

        function loadFromStorage() {
            const key = getStorageKey();
            const rawData = localStorage.getItem(key);
            if (rawData) {
                try {
                    users = JSON.parse(rawData);
                    userSelectableStatus = {};
                    users.forEach(u => userSelectableStatus[u] = true);
                    displayUsers();
                    storageStatus.textContent = `Loaded ${users.length} names from storage`;
                    return true;
                } catch (e) {
                    console.error("Failed to parse localStorage data", e);
                }
            }
            users = [];
            displayUsers();
            storageStatus.textContent = `No saved roster found. Please import your classlist CSV.`;
            return false;
        }

        function parseCSVLine(line) {
            const row = [];
            let inQuotes = false;
            let currentField = '';

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentField.trim());
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            row.push(currentField.trim());
            return row;
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return [];

            const header = parseCSVLine(lines[0]);
            const nameIdx = header.findIndex(col => col.toLowerCase() === 'name');
            const roleIdx = header.findIndex(col => col.toLowerCase() === 'role');

            if (nameIdx === -1) {
                alert("Could not find a 'Name' column in this CSV.");
                return [];
            }

            const parsedNames = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                if (cols.length <= nameIdx) continue;

                if (roleIdx !== -1 && cols[roleIdx] && cols[roleIdx].toLowerCase() !== 'learner') {
                    continue;
                }

                const fullName = cols[nameIdx];
                if (fullName.includes(',')) {
                    const parts = fullName.split(',');
                    const firstName = parts[1].trim().split(' ')[0];
                    if (firstName) parsedNames.push(firstName);
                } else if (fullName.trim() !== '') {
                    parsedNames.push(fullName.trim().split(' ')[0]);
                }
            }
            return parsedNames;
        }

        csvFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const extracted = parseCSV(event.target.result);
                if (extracted.length > 0) {
                    users = extracted;
                    userSelectableStatus = {};
                    users.forEach(u => userSelectableStatus[u] = true);
                    saveToStorage();
                    displayUsers();
                } else {
                    alert("No learner records were found in the uploaded file.");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        restoreSessionBtn.addEventListener('click', () => {
            loadFromStorage();
            selectedUserElement.textContent = '';
            removeButton.disabled = true;
            storageStatus.textContent = `Restored initial session roster (${users.length} students).`;
        });

        clearCacheBtn.addEventListener('click', () => {
            const key = getStorageKey();
            localStorage.removeItem(key);
            users = [];
            userSelectableStatus = {};
            displayUsers();
            selectedUserElement.textContent = '';
            removeButton.disabled = true;
            storageStatus.textContent = `Cleared saved data for "${COURSE_KEY}"`;
        });

        function displayUsers() {
            userListElement.innerHTML = '';
            users.forEach((userName, index) => {
                const li = document.createElement('li');

                const numSpan = document.createElement('span');
                numSpan.className = 'user-index';
                numSpan.textContent = `${index + 1}.`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `user-checkbox-${index}`;
                checkbox.checked = !userSelectableStatus[userName];

                checkbox.addEventListener('change', () => {
                    userSelectableStatus[userName] = !checkbox.checked;
                });

                const label = document.createElement('label');
                label.textContent = userName;
                label.setAttribute('for', `user-checkbox-${index}`);

                li.appendChild(numSpan);
                li.appendChild(checkbox);
                li.appendChild(label);
                userListElement.appendChild(li);
            });
        }

        function selectRandomUser() {
            const selectableUsers = users.filter(userName => userSelectableStatus[userName]);

            if (selectableUsers.length === 0) {
                selectedUserElement.textContent = "No names available.";
                removeButton.disabled = true;
                selectedUserName = null;
                return;
            }

            let loopCounter = 0;
            selectedUserElement.classList.add('looping-text');
            selectedUserElement.textContent = '';

            loopIntervalId = setInterval(() => {
                const index = loopCounter % selectableUsers.length;
                selectedUserElement.textContent = selectableUsers[index];
                loopCounter++;
            }, 100);

            setTimeout(() => {
                clearInterval(loopIntervalId);
                selectedUserElement.classList.remove('looping-text');
                selectedUserElement.classList.add('pulse');

                const randomIndex = Math.floor(Math.random() * selectableUsers.length);
                selectedUserName = selectableUsers[randomIndex];
                selectedUserElement.textContent = selectedUserName;
                removeButton.disabled = false;
                selectedUserElement.addEventListener('animationend', () => {
                    selectedUserElement.classList.remove('pulse');
                }, { once: true });
            }, loopDuration);
        }

        function removeSelectedUser() {
            if (selectedUserName) {
                const indexToRemove = users.indexOf(selectedUserName);
                if (indexToRemove > -1) {
                    const listItemToRemove = userListElement.children[indexToRemove];
                    listItemToRemove.classList.add('removed-item');

                    listItemToRemove.addEventListener('animationend', () => {
                        users.splice(indexToRemove, 1);
                        displayUsers();
                        selectedUserElement.textContent = '';
                        selectedUserName = null;
                        removeButton.disabled = true;
                        if (users.length === 0) {
                            selectedUserElement.textContent = "No users left.";
                        }
                    }, { once: true });
                }
            }
        }

        selectButton.addEventListener('click', selectRandomUser);
        removeButton.addEventListener('click', removeSelectedUser);

        loadFromStorage();
    </script>
</body>
</html>
